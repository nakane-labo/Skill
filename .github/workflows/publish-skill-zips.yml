name: Publish per-skill ZIPs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack each skill folder
        run: |
          set -euo pipefail
          for skill in academic-research-skills-nakanelabo paper-kodoku-prep booksection-rindoku-prep; do
            test -f "$skill/SKILL.md"
            zip -r "${skill}.zip" "$skill"
          done

      - name: Publish skills-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes='各スキルを独立してダウンロードするための ZIP です。リポジトリ全体ではなく、使いたい ZIP だけを解凍して .cursor/skills/ または .claude/skills/ に置いてください。'
          if gh release view skills-latest >/dev/null 2>&1; then
            gh release upload skills-latest \
              academic-research-skills-nakanelabo.zip \
              paper-kodoku-prep.zip \
              booksection-rindoku-prep.zip \
              --clobber
          else
            gh release create skills-latest \
              academic-research-skills-nakanelabo.zip \
              paper-kodoku-prep.zip \
              booksection-rindoku-prep.zip \
              --title "スキル個別 ZIP" \
              --notes "$notes"
          fi
